name: CI

on:
  pull_request:
    branches: [main]

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: pip install beautifulsoup4 lxml
      - name: QA check (all tools)
        run: python scripts/qa_check.py --all
