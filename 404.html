    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0a0a0b;
      --surface: #111113;
      --border: rgba(255,255,255,0.08);
      --border-2: rgba(255,255,255,0.14);
      --text-1: #fafafa;
      --text-2: #a1a1aa;
      --text-3: #52525b;
      --accent: #6366f1;
      --success: #22c55e;

      --radius-lg: 12px;
      --font: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text-2);
      font-family: var(--font);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }

    .container {
      max-width: 720px;
      margin: 0 auto;
      padding: 0 24px;
    }

    /* Navbar */
    .navbar {
      border-bottom: 1px solid var(--border);
      padding: 14px 0;
      position: sticky;
      top: 0;
      z-index: 100;
      backdrop-filter: blur(12px);
      background: rgba(10,10,11,0.85);
    }
    .nav-inner {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .nav-logo {
      font-size: 14px;
      font-weight: 500;
      color: var(--text-1);
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .logo-mark {
      width: 20px;
      height: 20px;
      background: var(--accent);
      border-radius: 6px;
      flex-shrink: 0;
    }
    .nav-actions {
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .lang-toggle {
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text-3);
      font-size: 12px;
      font-weight: 500;
      padding: 4px 10px;
      cursor: pointer;
      font-family: var(--font);
      transition: border-color 0.15s, color 0.15s;
    }
    .lang-toggle:hover { border-color: var(--border-2); color: var(--text-2); }
    .nav-back {
      font-size: 13px;
      color: var(--text-3);
      text-decoration: none;
      transition: color 0.15s;
    }
    .nav-back:hover { color: var(--text-2); }

    /* Hero */
    .hero {
      padding: 56px 0 40px;
      border-bottom: 1px solid var(--border);
    }
    .eyebrow {
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--text-3);
      margin-bottom: 12px;
    }
    h1 {
      font-size: 1.75rem;
      font-weight: 500;
      letter-spacing: -0.03em;
      color: var(--text-1);
      margin-bottom: 12px;
    }
    .hero-desc {
      font-size: 0.95rem;
      color: var(--text-2);
      max-width: 480px;
    }

    /* Content */
    .content {
      padding: 48px 0 64px;
    }
    .content h2 {
      font-size: 1rem;
      font-weight: 500;
      color: var(--text-1);
      letter-spacing: -0.01em;
      margin: 36px 0 12px;
    }
    .content h2:first-child { margin-top: 0; }
    .content p {
      font-size: 0.9rem;
      color: var(--text-2);
      margin-bottom: 14px;
      line-height: 1.7;
    }
    .content p:last-child { margin-bottom: 0; }
    .content ul {
      list-style: none;
      margin: 0 0 14px;
      padding: 0;
    }
    .content ul li {
      font-size: 0.9rem;
      color: var(--text-2);
      padding: 5px 0;
      padding-left: 18px;
      position: relative;
    }
    .content ul li::before {
      content: '—';
      position: absolute;
      left: 0;
      color: var(--text-3);
    }
    .content a {
      color: var(--accent);
      text-decoration: none;
    }
    .content a:hover { text-decoration: underline; }

    .divider {
      height: 1px;
      background: var(--border);
      margin: 36px 0;
    }

    /* Footer */
    .footer {
      border-top: 1px solid var(--border);
      padding: 24px 0;
    }
    .footer-inner {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      color: var(--text-3);
      flex-wrap: wrap;
      gap: 12px;
    }
    .footer-links {
      display: flex;
      gap: 16px;
    }
    .footer a {
      color: var(--text-3);
      text-decoration: none;
      transition: color 0.15s;
    }
    .footer a:hover { color: var(--text-2); }

    @media (max-width: 640px) {
      h1 { font-size: 1.4rem; }
      .footer-inner { flex-direction: column; align-items: flex-start; }
    }
  </style>
